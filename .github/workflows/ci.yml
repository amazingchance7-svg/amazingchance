name: CI

on:
  push:
    branches:
      - main
      - docs-architecture
      - rep-001-runtime
      - rep-001-eslint
      - rep-001-jest
      - rep-001-integration
      - rep-001-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://amazing_chance_runtime_test:amazing_chance_runtime_test@127.0.0.1:55432/amazing_chance_test?schema=public
      TEST_DATABASE_URL: postgresql://amazing_chance_runtime_test:amazing_chance_runtime_test@127.0.0.1:55432/amazing_chance_test?schema=public
      TEST_ADMIN_DATABASE_URL: postgresql://amazing_chance_admin:amazing_chance_admin@127.0.0.1:55432/amazing_chance_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://amazing_chance_admin:amazing_chance_admin@127.0.0.1:55432/amazing_chance_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-bytes-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-bytes-long
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "86400"
      EMAIL_VERIFICATION_TTL_SECONDS: "3600"
      PASSWORD_RESET_TTL_SECONDS: "3600"
      API_PORT: "3001"
      WEB_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level critical

      - name: Check Prisma formatting
        run: pnpm --filter @amazing-chance/api exec prisma format --check

      - name: Validate Prisma schema
        run: pnpm --filter @amazing-chance/api exec prisma validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
