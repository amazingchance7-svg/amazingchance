services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amazing_chance_test
      POSTGRES_USER: amazing_chance_admin
      POSTGRES_PASSWORD: amazing_chance_admin
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U amazing_chance_admin -d amazing_chance_test"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
