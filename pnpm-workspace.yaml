packages:
  - apps/*
  - packages/*

# SEC-027: fail closed when a new dependency introduces install scripts.
# @prisma/engines is intentionally blocked; Prisma generate/tests work without it.
savePrefix: ''
strictDepBuilds: true
ignoredBuiltDependencies:
  - "@prisma/engines"
  - "@scarf/scarf"
  - argon2
  - prisma
  - unrs-resolver

# SEC-027: temporary remediation for GHSA-ggr8-5vv4-36mx.
# Remove when @prisma/config ships with deepmerge-ts >=8.
overrides:
  "@prisma/config@7.9.1>deepmerge-ts": "8.0.0"
